# Reachy Mini Official Action Catalog
#
# Source       : docs/research/2026-05-28-official-stack.md
#                + Pollen Robotics HF datasets (pollen-robotics/reachy-mini-
#                  dances-library, pollen-robotics/reachy-mini-emotions-library)
#                + Reachy Mini Conversation App LLM tools
#                  (dance, stop_dance, play_emotion, stop_emotion, move_head,
#                   camera, head_tracking, idle_do_nothing).
# Last-updated : 2026-05-28
# Verification : DRAFT - not hardware-verified.  All durations are upper-bound
#                estimates derived from public tool descriptions and library
#                sample lengths; replace with measured values once real Reachy
#                Mini benchmarking is available.  Mark verified entries with a
#                future ``verified_at_<date>`` field per
#                docs/research/reachy-official-action-catalog.md.
#
# Schema (per entry):
#   name                  : unique identifier used by the orchestrator
#   type                  : dance | emotion | pose | speech | camera | stop
#   official_tool         : LLM tool name from the conversation app
#   estimated_duration_ms : upper-bound expected runtime, integer ms
#   interruptible         : true | false | unknown  (use unknown liberally)
#   has_stop_tool         : bool; does a discrete stop primitive exist?
#   stop_tool             : optional, name of the stop primitive
#   requires_segmentation : bool; ADR-0001 - true for non-interruptible long
#                           actions that need chunking to allow preemption
#   cpu_risk              : low | medium | high
#   source                : provenance string (dataset / doc URL fragment)
#   notes                 : free text

